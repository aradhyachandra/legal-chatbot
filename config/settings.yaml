# ============================================================
# Legal RAG Chatbot — Configuration Template
# ============================================================
# These values are not yet loaded at runtime. They document
# the key parameters that are currently hardcoded in source
# files. A future refactor can wire this file into the pipeline
# using PyYAML / pydantic-settings.
# ============================================================

# --- Document Ingestion ---
ingestion:
  data_dir: "data/raw"          # Directory to scan for PDF files
  chunk_size: 500               # Max characters per chunk
  chunk_overlap: 50             # Overlap between consecutive chunks

# --- Vector Store ---
vector_store:
  chroma_path: "./embeddings/chroma_db"
  collection_name: "legal_documents"

# --- Retrieval ---
retrieval:
  n_results: 3                  # Number of chunks to retrieve per query
  distance_threshold: 0.65      # Chunks with distance > this are discarded

# --- Models (via Ollama) ---
models:
  llm: "llama3.2"
  embeddings: "nomic-embed-text"
